<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniFarm Hub — API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; font-family: sans-serif; background: #f8fafc; }
    #swagger-ui .topbar { background: #052e16; }
    #swagger-ui .topbar-wrapper .link { display: none; }
    #swagger-ui .topbar-wrapper::before {
      content: '🌾 OmniFarm Hub — API v1';
      color: #86efac;
      font-size: 1rem;
      font-weight: 700;
      padding: 0 1rem;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: '/api/v1/openapi.json',
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: 'BaseLayout',
      deepLinking: true,
      tryItOutEnabled: true,
      requestInterceptor: (req) => {
        const stored = sessionStorage.getItem('omnifarm_token');
        if (stored && !req.headers['Authorization']) {
          req.headers['Authorization'] = 'Bearer ' + stored;
        }
        return req;
      },
      responseInterceptor: (res) => {
        if (res.url.endsWith('/auth/token') && res.status === 200) {
          try {
            const body = JSON.parse(res.text);
            if (body.access_token) sessionStorage.setItem('omnifarm_token', body.access_token);
          } catch {}
        }
        return res;
      },
    });
  </script>
</body>
</html>
