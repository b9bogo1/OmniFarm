{% extends 'base.html' %}
{% block title %}404 — {{ _('Page introuvable') }}{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
  <div class="w-20 h-20 rounded-2xl swatch-amber flex items-center justify-center text-4xl mx-auto mb-6 stat-icon-box">🔍</div>
  <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">{{ _('Erreur') }}</p>
  <h1 class="text-7xl font-extrabold mb-3" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</h1>
  <p class="text-xl font-bold text-slate-700 mb-2">{{ _('Page introuvable') }}</p>
  <p class="text-sm text-slate-400 mb-8 max-w-sm font-medium">{{ _('La ressource demandée n\'existe pas ou a été déplacée.') }}</p>
  <a href="{{ url_for('main.dashboard') }}" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl text-white text-sm font-bold btn-premium-primary">
    ← {{ _('Retour au tableau de bord') }}
  </a>
</div>
{% endblock %}
